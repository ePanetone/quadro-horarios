<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar - Quadro de Horários</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">
  <div class="container d-flex align-items-center justify-content-center min-vh-100 px-3">
    <div class="card shadow-sm w-100" style="max-width: 380px">
      <div class="card-body p-4">
        <h4 class="text-center mb-1">💻 Quadro de Horários</h4>
        <p class="text-center text-muted mb-4">Acesso dos funcionários</p>

        <form id="form">
          <div class="mb-3">
            <label class="form-label" for="nome">Seu nome</label>
            <input id="nome" class="form-control" maxlength="30" autocomplete="name" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="senha">Senha da escola</label>
            <input id="senha" type="password" class="form-control" autocomplete="current-password" required />
          </div>
          <div id="erro" class="alert alert-danger py-2 d-none"></div>
          <button class="btn btn-primary w-100" id="btn">Entrar</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    try { $('nome').value = localStorage.getItem('nomeFuncionario') || ''; } catch (e) {}

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('erro').classList.add('d-none');
      $('btn').disabled = true;
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome: $('nome').value, senha: $('senha').value }),
        });
        const d = await r.json();
        if (d.ok) {
          try { localStorage.setItem('nomeFuncionario', $('nome').value.trim().slice(0, 30)); } catch (e) {}
          location.href = '/';
          return;
        }
        $('erro').textContent = d.erro || 'Não foi possível entrar.';
      } catch (err) {
        $('erro').textContent = 'Sem conexão com o servidor.';
      }
      $('erro').classList.remove('d-none');
      $('btn').disabled = false;
    });
  </script>
</body>
</html>
