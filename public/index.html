<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quadro de Horários - Informática</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Barra superior -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid px-3 px-lg-4 gap-2">
      <span class="navbar-brand mb-0 h1">💻 Quadro de Horários</span>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span id="status" class="badge text-bg-secondary">Conectando...</span>
        <button id="btnTrocarNome" class="btn btn-sm btn-outline-light">
          👤 <span id="meuNome">Identificar-se</span>
        </button>
        <a href="/sair" class="btn btn-sm btn-outline-light">Sair</a>
      </div>
    </div>
  </nav>

  <!-- Quem está conectado -->
  <div class="online-bar">
    <div class="container-fluid px-3 px-lg-4 d-flex align-items-center flex-wrap gap-2">
      <small class="text-muted">Conectados agora (<span id="contOnline">0</span>):</small>
      <div id="listaOnline" class="d-flex flex-wrap gap-1"></div>
    </div>
  </div>

  <main class="container-fluid px-3 px-lg-4 py-3">
    <!-- Abas -->
    <ul class="nav nav-pills mb-3">
      <li class="nav-item">
        <button class="nav-link active" data-view="quadro">📅 Quadro</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-view="alunos">🎓 Alunos</button>
      </li>
    </ul>

    <!-- ===== VIEW: QUADRO ===== -->
    <section id="viewQuadro">
      <div class="row g-2 mb-2">
        <div class="col-12 col-md-4">
          <select id="filtroCurso" class="form-select">
            <option value="">Todos os cursos</option>
          </select>
        </div>
        <div class="col-12 col-md-5">
          <input id="filtroAluno" type="search" class="form-control"
                 placeholder="Filtrar por nome do aluno..." autocomplete="off" />
        </div>
        <div class="col-12 col-md-3 d-grid">
          <button id="btnLimpar" class="btn btn-outline-secondary">Limpar filtros</button>
        </div>
      </div>
      <p id="contador" class="text-muted small mb-2"></p>

      <div id="areaQuadro">
        <!-- Computador e tablet -->
        <div class="table-responsive d-none d-md-block">
          <table class="table table-bordered quadro" id="quadro"></table>
        </div>
        <!-- Celular -->
        <div class="d-md-none" id="quadroMobile"></div>
      </div>
    </section>

    <!-- ===== VIEW: ALUNOS ===== -->
    <section id="viewAlunos" class="d-none">
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title" id="tituloFormAluno">Cadastrar aluno</h5>
          <form id="formAluno" class="row g-2">
            <div class="col-12 col-md-8">
              <input id="alunoNome" class="form-control" maxlength="100"
                     placeholder="Nome completo do aluno" autocomplete="off" />
            </div>
            <div class="col-6 col-md-2 d-grid">
              <button type="submit" class="btn btn-primary" id="btnSalvarAluno">Cadastrar</button>
            </div>
            <div class="col-6 col-md-2 d-grid">
              <button type="button" class="btn btn-outline-secondary d-none" id="btnCancelarAluno">
                Cancelar
              </button>
            </div>
          </form>
          <div class="alert alert-danger mt-3 mb-0 d-none" id="alunoErro"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header d-flex flex-wrap align-items-center gap-2">
          <strong class="me-auto">Alunos cadastrados (<span id="totalAlunos">0</span>)</strong>
          <input id="buscaAluno" type="search" class="form-control form-control-sm busca-aluno"
                 placeholder="Buscar aluno..." autocomplete="off" />
        </div>
        <ul class="list-group list-group-flush" id="listaAlunos"></ul>
      </div>
    </section>
  </main>

  <!-- Modal: adicionar / editar aluno no horário -->
  <div class="modal fade" id="modalAula" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo">Aluno</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="aulaId" />
          <input type="hidden" id="aulaDia" />
          <input type="hidden" id="aulaHorario" />

          <div class="alert alert-warning d-none" id="semAlunos">
            Nenhum aluno cadastrado. Vá na aba <strong>Alunos</strong> e cadastre primeiro.
          </div>

          <div class="mb-3">
            <label class="form-label" for="aulaAluno">Aluno *</label>
            <select id="aulaAluno" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="aulaCurso">Curso *</label>
            <select id="aulaCurso" class="form-select"></select>
          </div>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="aulaReposicao" />
            <label class="form-check-label" for="aulaReposicao">É reposição</label>
          </div>
          <div class="mb-3 d-none" id="boxObs">
            <label class="form-label" for="aulaObs">Observação da reposição</label>
            <input type="text" class="form-control" id="aulaObs" maxlength="200"
                   placeholder="Ex.: repondo aula do dia 03/10" />
          </div>
          <div class="alert alert-danger d-none mb-0" id="aulaErro"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btnSalvarAula">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: confirmar exclusão -->
  <div class="modal fade" id="modalConfirmar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">⚠️ Confirmar exclusão</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="confirmarTexto"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmarOk">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: nome do funcionário -->
  <div class="modal fade" id="modalNome" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Quem é você?</h5>
        </div>
        <div class="modal-body">
          <label class="form-label" for="inputNome">Seu nome (aparece para os outros funcionários)</label>
          <input type="text" class="form-control" id="inputNome" maxlength="30" autocomplete="off" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="btnEntrar">Entrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
